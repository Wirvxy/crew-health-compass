# Continuous integration (CI): GitHub runs these checks automatically on every
# pull request into main and on every push to main. A red check means
# "do not merge until it is fixed".
name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# The token GitHub gives this workflow may only read the repository.
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      # Actions are pinned to full commit SHAs, so a moved tag cannot change
      # what runs here. The comment names the release each SHA belongs to.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not store the token in .git/config, where later steps
          # (including npm install scripts) could read it.
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The locked vite and @vitejs/plugin-react require
          # Node ^20.19.0 || >=22.12.0 (see frontend/package-lock.json).
          node-version: 24
          # No dependency cache: simpler, and a cache cannot be poisoned.
          package-manager-cache: false

      - name: Install exact locked dependencies
        run: npm ci

      - name: Type-check and build (tsc --noEmit && vite build)
        run: npm run build

      - name: Audit dependencies (fail on high or critical)
        run: npm audit --audit-level=high

  backend:
    name: Backend tests and audit (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Report both Python versions even if one fails.
      fail-fast: false
      matrix:
        # 3.11 is the lowest version FastAPI supports; 3.14 is the version
        # used locally. 3.12 and 3.13 are not tested.
        python-version:
          - "3.11"
          - "3.14"
    defaults:
      run:
        working-directory: api
        # Explicit bash adds "-o pipefail", so a failure anywhere in a pipe
        # (such as pip freeze | tee) fails the step.
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt

      # Save (and print) the exact packages the tests run with, before
      # pip-audit and its own dependencies are installed.
      - name: Record installed packages
        run: python -m pip freeze | tee "$RUNNER_TEMP/installed.txt"

      - name: Run tests
        run: python -m pytest

      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1

      # Audit that exact list and fail on any known vulnerability (pip-audit
      # has no severity threshold). --no-deps --disable-pip stop pip-audit
      # from re-resolving the list in its own temporary environment, where
      # packages that are already present there (packaging, via wheel) are
      # silently left out.
      - name: Audit installed dependencies (fail on any known vulnerability)
        run: python -m pip_audit -r "$RUNNER_TEMP/installed.txt" --no-deps --disable-pip

  secrets:
    name: Secret scan (gitleaks, full Git history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        # Explicit bash adds "-o pipefail", so a failure anywhere in a pipe
        # (such as echo | sha256sum) fails the step.
        shell: bash
    env:
      GITLEAKS_VERSION: "8.30.1"
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz. It matches the release's
      # checksums.txt and GitHub's asset digest (checked 14 November 2026).
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Check out repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 0 = fetch every commit on every branch, so the scan sees the
          # whole history, not just the latest files.
          fetch-depth: 0
          persist-credentials: false

      - name: Download Gitleaks and verify its checksum
        run: |
          curl -fsSLo "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      # Scans the lines added by every commit on every branch. Any finding
      # fails the job (exit code 1). Secrets are redacted in the log. No
      # allowlist, baseline or config file is used. Binary files (such as
      # .xlsx and .zip) are not scanned in this mode.
      - name: Scan full Git history
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner --exit-code 1 .

  # Pending checks, added when the code they check exists:
  # - Python lint (ruff): not set up yet.
  # - Frontend lint: frontend/package.json has no lint script and no ESLint.
