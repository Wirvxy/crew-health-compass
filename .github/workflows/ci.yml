# Continuous integration (CI): GitHub runs these checks automatically on every
# pull request into main and on every push to main. A red check means
# "do not merge until it is fixed".
name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# The token GitHub gives this workflow may only read the repository.
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      # Actions are pinned to full commit SHAs, so a moved tag cannot change
      # what runs here. The comment names the release each SHA belongs to.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not store the token in .git/config, where later steps
          # (including npm install scripts) could read it.
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The locked vite and @vitejs/plugin-react require
          # Node ^20.19.0 || >=22.12.0 (see frontend/package-lock.json).
          node-version: 24
          # No dependency cache: simpler, and a cache cannot be poisoned.
          package-manager-cache: false

      - name: Install exact locked dependencies
        run: npm ci

      - name: Type-check and build (tsc --noEmit && vite build)
        run: npm run build

      - name: Audit dependencies (fail on high or critical)
        run: npm audit --audit-level=high

  backend:
    name: Backend tests and audit (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Report both Python versions even if one fails.
      fail-fast: false
      matrix:
        # 3.11 is the lowest version FastAPI supports; 3.14 is the version
        # used locally. 3.12 and 3.13 are not tested.
        python-version:
          - "3.11"
          - "3.14"
    defaults:
      run:
        working-directory: api
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1

      # Resolves requirements-dev.txt (direct and sub-dependencies) and fails
      # on any known vulnerability. pip-audit has no severity threshold.
      - name: Audit dependencies (fail on any known vulnerability)
        run: python -m pip_audit -r requirements-dev.txt

  # Pending checks, added when the code they check exists:
  # - Python lint (ruff): not set up yet.
  # - Frontend lint: frontend/package.json has no lint script and no ESLint.
  # - Secret scanning (gitleaks): planned for H8-H11.
